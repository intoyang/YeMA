<include src="layout.html">
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">Page</title>
  </template>

  <article class="max-w-reading mx-auto px-6 py-section-v">
    <header class="text-center mb-12">
      <h1 class="text-h-lg md:text-display font-serif text-text mb-4" th:text="${singlePage.spec.title}"></h1>
      <p
        th:if="${not #strings.isEmpty(singlePage.status.excerpt)}"
        class="text-body-e text-text-muted font-serif italic"
        th:text="${singlePage.status.excerpt}"
      ></p>
    </header>

    <div class="post-content" th:utext="${singlePage.content.content}"></div>

    <!-- Comments -->
    <th:block th:if="${haloCommentEnabled and singlePage.spec.allowComment}">
      <section class="mt-16 pt-12 border-t border-border comment-wrapper">
        <h2 class="text-h-md font-serif text-text mb-8">评论</h2>
        <halo:comment
          group="content.halo.run"
          kind="SinglePage"
          th:attr="name=${singlePage.metadata.name}"
        />
      </section>
    </th:block>
  </article>
</include>
